      <stop offset="0%" stop-color="#ece4d3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ece4d3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wineShade" cx="82%" cy="92%" r="60%">
      <stop offset="0%" stop-color="#7c2a35" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7c2a35" stop-opacity="0"/>
