  </defs>
  <rect width="1200" height="750" fill="#f5f0e5"/>
  <rect width="1200" height="750" fill="url(#paperShade)"/>
  <rect width="1200" height="750" fill="url(#wineShade)"/>
  <circle cx="600" cy="300" r="220" fill="none" stroke="rgba(124,42,53,0.18)" stroke-width="1"/>
  <circle cx="600" cy="300" r="150" fill="none" stroke="rgba(124,42,53,0.28)" stroke-width="1"/>

  <text x="600" y="270" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="80" fill="#1c1a17" text-anchor="middle" letter-spacing="1">Duo</text>
