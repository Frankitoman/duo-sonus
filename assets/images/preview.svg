  <line x1="530" y1="392" x2="670" y2="392" stroke="rgba(124,42,53,0.4)" stroke-width="1"/>

  <text x="600" y="428" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#7c2a35" text-anchor="middle" letter-spacing="5">ACCORDION DUO — COPENHAGEN</text>
  <text x="600" y="468" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="21" fill="#55504a" text-anchor="middle" letter-spacing="0.5">"Two accordions, one vibrant sound."</text>
  <text x="600" y="506" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#96897a" text-anchor="middle" letter-spacing="3">TANGO · CLASSICAL · CONTEMPORARY</text>

  <!-- Performance map: 5 countries, echoing the site's own tour-map feature -->
